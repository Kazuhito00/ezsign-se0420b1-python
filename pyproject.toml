[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezsign-usb"
version = "0.1.0"
description = "Unofficial Python driver for Santek EZ Sign SE0420B1 USB four-color displays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KazuhitoTakahashi" }]
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5,<4", "pillow>=11,<14"]

[project.urls]
Homepage = "https://github.com/Kazuhito00/ezsign-se0420b1-python"
Repository = "https://github.com/Kazuhito00/ezsign-se0420b1-python"
Issues = "https://github.com/Kazuhito00/ezsign-se0420b1-python/issues"

[project.scripts]
ezsign = "ezsign_usb.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ezsign_usb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
